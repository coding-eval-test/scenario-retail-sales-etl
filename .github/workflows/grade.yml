name: Grade

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grade:
    name: Score submission
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC

    steps:
      - name: Check out the submission
        uses: actions/checkout@v4

      - name: Set up Java 17 (Spark runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile once
        run: python -m compileall -q src tests

      # A work item scores its points only when the whole category passes.
      # The job always exits 0: a partial score is work in progress, not a broken build.
      #
      # Work items, their points, and their labels all come from scenario.json —
      # editing that one file is how a scenario changes what it grades.
      #
      # Exit code alone is not enough. `pytest -m X` exits 5 when NOTHING matches X
      # (and still writes a report with tests="0"), so a mistyped or missing category
      # must land in no-tests via the count — never in fail via the exit code. And a
      # category with any skipped test scores 0: executed = tests - skipped is what
      # tells "all passed" from "some dodged".
      - name: Score every work item
        id: score
        shell: bash
        run: |
          total=0
          max=0
          json_items=""

          {
            echo "## Scorecard"
            echo ""
            echo "| Work item | Result | Points |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS=$'\t' read -r category worth label; do
            max=$((max + worth))

            # stdin is redirected: a tool reading stdin would otherwise eat the rest
            # of the manifest off this loop and only the first item would score.
            rm -rf reports
            echo "::group::${category} — ${label}"
            if python -m pytest -m "${category}" --junitxml="reports/${category}.xml" < /dev/null; then
              suite_passed=1
            else
              suite_passed=0
            fi
            echo "::endgroup::"

            report="reports/${category}.xml"
            tests=""
            skipped=""
            if [ -e "$report" ]; then
              tests=$(sed -n 's/.*<testsuite [^>]*tests="\([0-9]*\)".*/\1/p' "$report" | head -1)
              skipped=$(sed -n 's/.*<testsuite [^>]*skipped="\([0-9]*\)".*/\1/p' "$report" | head -1)
            else
              echo "::error::${report} was not written — pytest did not run, or --junitxml is broken."
            fi
            executed=$(( ${tests:-0} - ${skipped:-0} ))

            if [ "$executed" -le 0 ]; then
              earned=0
              result="no-tests"
              icon="NO TESTS"
              echo "::warning::No tests ran for marker ${category}. Scoring 0 — check scenario.json against the pytest markers."
            elif [ "${skipped:-0}" -gt 0 ]; then
              earned=0
              result="skipped"
              icon="SKIPPED"
              echo "::warning::${skipped} test(s) skipped in ${category}. A category with skipped tests scores 0."
            elif [ "$suite_passed" -eq 1 ]; then
              earned="$worth"
              result="pass"
              icon="PASS"
            else
              earned=0
              result="fail"
              icon="FAIL"
            fi

            total=$((total + earned))
            echo "| ${label} | ${icon} | ${earned} / ${worth} |" >> "$GITHUB_STEP_SUMMARY"

            if [ -n "$json_items" ]; then
              json_items="${json_items},"
            fi
            json_items="${json_items}{\"category\":\"${category}\",\"label\":\"${label}\",\"result\":\"${result}\",\"tests\":${executed},\"earned\":${earned},\"possible\":${worth}}"
          done < <(jq -r '.categories[] | [.category, .points, .label] | @tsv' scenario.json)

          {
            echo "| **Total** | | **${total} / ${max}** |"
            echo ""
            echo "Run \`./scripts/check.sh\` (or \`./scripts/check.ps1\`) locally for the same per-item split."
          } >> "$GITHUB_STEP_SUMMARY"

          cat > score.json <<JSON
          {
            "repository": "${GITHUB_REPOSITORY}",
            "sha": "${GITHUB_SHA}",
            "runId": "${GITHUB_RUN_ID}",
            "total": ${total},
            "possible": ${max},
            "items": [${json_items}]
          }
          JSON

          echo "total=${total}" >> "$GITHUB_OUTPUT"
          echo "possible=${max}" >> "$GITHUB_OUTPUT"
          echo "Scored ${total}/${max}."

      - name: Upload score.json
        uses: actions/upload-artifact@v4
        with:
          name: score
          path: score.json
          if-no-files-found: error
